name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      # Report both devices even when one fails: the two legs disagree by design
      # (chunked forwards drift ~1e-4 on Metal), so a single red leg must not hide
      # whether the other one is green.
      fail-fast: false
      matrix:
        # cpu is bit-exact; metal is the default device and the path real traffic
        # takes. Pinning cpu alone once let a Metal-only failure pass CI unnoticed.
        device: [cpu, metal]
    env:
      LAYA_MLX_TEST_DEVICE: ${{ matrix.device }}
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: 573e5b62696ba441230cd6be71d593331b5d23af
          path: .upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,reference,demo]' -e './server[mcp]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q tests server/tests
      - run: python -m build && python -m build --wheel --outdir /tmp/server-dist server
        if: matrix.device == 'cpu'
