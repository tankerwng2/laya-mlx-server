name: CI

on:
  push:
  pull_request:
  # release.yml calls this file as a reusable workflow (jobs.test.uses). Without
  # workflow_call, GitHub rejects the release file at parse time: zero jobs, no
  # log. Release has never been tagged, so nothing surfaced it (actionlint, 10-18).
  workflow_call: {}

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow lint (schema + expressions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          # GitHub rejects a workflow file whose schema is invalid only at RUN time:
          # the run gets zero jobs, no log, and CI stays green because ci.yml parses
          # fine. A bad `permissions:` key in upstream-sync.yml silently killed the
          # whole sync schedule that way, so validate every workflow file here.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) >/dev/null
          ./actionlint -color
  test:
    name: test (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      # Report both devices even when one fails: the two legs disagree by design
      # (chunked forwards drift ~1e-4 on Metal), so a single red leg must not hide
      # whether the other one is green.
      fail-fast: false
      matrix:
        # cpu is bit-exact; metal is the default device and the path real traffic
        # takes. Pinning cpu alone once let a Metal-only failure pass CI unnoticed.
        device: [cpu, metal]
    env:
      LAYA_MLX_TEST_DEVICE: ${{ matrix.device }}
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: 573e5b62696ba441230cd6be71d593331b5d23af
          path: .upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,reference,demo]' -e './server[mcp]'
      - run: ruff check . && ruff format --check .
      - name: Run pytest (retry on runner SIGBUS)
        run: |
          # macos-26 hosted runners intermittently kill pytest with SIGBUS (exit 138)
          # ~15s in, at model load. Same head passes on the metal leg and minutes
          # later on cpu, and the full suite passes locally with
          # LAYA_MLX_TEST_DEVICE=cpu (237 passed), so 138 is infrastructure flake:
          # retry it, but let genuine failures (any other exit code) fail at once.
          for attempt in 1 2 3; do
            pytest -q tests server/tests && break
            code=$?
            if [ "$code" != 138 ] || [ "$attempt" = 3 ]; then
              exit "$code"
            fi
            echo "::warning::pytest exited 138 (SIGBUS) on attempt $attempt; retrying"
            sleep 20
          done
      - run: python -m build && python -m build --wheel --outdir /tmp/server-dist server
        if: matrix.device == 'cpu'
  # Fails the build if the mirrored model layer drifted from mizorewww/laya-mlx
  # main. This is the standing guarantee behind the upstream-sync workflow: even
  # if a sync cycle is missed, the first push shows red. The pathspec must stay
  # in lockstep with the fork-owned list in upstream-sync.yml.
  sync-freshness:
    name: sync freshness (mirror layer == upstream/main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add upstream remote (fetch-only; push is disabled in .gitconfig by remote name)
        run: git remote add upstream https://github.com/mizorewww/laya-mlx.git
      - run: git fetch --depth 1 upstream main
      - name: Assert mirror paths are byte-identical to upstream/main
        run: |
          git diff --quiet upstream/main -- \
            'laya_mlx' \
            'benchmarks' 'BENCHMARKS.md' 'NOTICE' 'LICENSE' \
            'examples' 'experiments' 'scripts' 'docs' \
            'tests' ':!tests/test_router.py' ':!tests/test_runtime.py' \
            || { echo "::error::the mirrored model layer has drifted from mizorewww/laya-mlx main; run the upstream-sync workflow"; exit 1; }
